[project]
name = "clawaimail"
version = "0.1.0"
description = "ClawAIMail SDK - Email inbox API for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    {name = "ClawAIMail", email = "support@clawaimail.com"}
]
keywords = ["email", "ai", "agent", "api", "clawaimail", "mcp", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email",
]

[project.urls]
Homepage = "https://clawaimail.com"
Documentation = "https://clawaimail.com/docs"
Source = "https://github.com/joansongjr/clawaimail"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
